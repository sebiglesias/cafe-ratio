<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="dripperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#d6d3d1"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="104" fill="none" stroke="#d97706" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Coffee Dripper (V60 / Chemex silhouette) -->
  <g filter="drop-shadow(0 16px 24px rgba(0,0,0,0.6))">
    <!-- Top Cone -->
    <path d="M 120 120 L 392 120 L 296 280 L 216 280 Z" fill="url(#dripperGrad)"/>
    <!-- Rim -->
    <ellipse cx="256" cy="120" rx="136" ry="16" fill="#f5f5f4" stroke="#a8a29e" stroke-width="3"/>
    
    <!-- Ribs on cone (V60 spiral ribs) -->
    <path d="M 170 135 C 195 190 225 240 236 275" stroke="#a8a29e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 230 135 C 245 185 255 235 256 275" stroke="#a8a29e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 290 135 C 285 185 275 235 268 275" stroke="#a8a29e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 345 135 C 325 190 295 240 276 275" stroke="#a8a29e" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Dripper Base / Collar -->
    <path d="M 190 280 L 322 280 L 302 295 L 210 295 Z" fill="#b45309"/>

    <!-- Server Carafe Glass -->
    <path d="M 216 300 
             C 170 340 160 400 160 420 
             L 352 420 
             C 352 400 342 340 296 300 
             Z" fill="rgba(255,255,255,0.08)" stroke="#78716c" stroke-width="3"/>

    <!-- Fresh Brewed Coffee in Server -->
    <path d="M 180 370 
             C 210 365 290 375 332 370 
             C 342 390 346 410 346 418 
             L 166 418 
             C 166 410 170 390 180 370 
             Z" fill="url(#coffeeGrad)"/>
    
    <!-- Crema / Surface Reflection -->
    <ellipse cx="256" cy="370" rx="76" ry="6" fill="#fbbf24" opacity="0.6"/>

    <!-- Coffee Drop falling -->
    <path d="M 256 315 C 251 325 248 335 256 345 C 264 335 261 325 256 315 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Ratio 1:16 Badge -->
  <g transform="translate(320, 80)">
    <rect x="0" y="0" width="120" height="42" rx="21" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
    <text x="60" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900" fill="#1c1917" text-anchor="middle">1 : 16</text>
  </g>
</svg>
